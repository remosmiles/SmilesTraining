<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Homegym Tracker - Cloud Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --primary: #bb86fc; --text-main: #ffffff; --text-muted: #a0a0a0; --success: #03dac6; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; padding-bottom: 80px; }
        h1, h2 { text-align: center; }
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #333; color: white; }
        .btn.active { background-color: var(--primary); color: #000; }
        select { width: 100%; padding: 15px; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--primary); border-radius: 8px; font-size: 16px; margin-bottom: 20px; appearance: none; }
        .exercise-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .exercise-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: var(--primary); }
        .exercise-target { font-size: 14px; color: var(--text-muted); margin-bottom: 15px; }
        .last-workout { font-size: 13px; color: var(--success); margin-bottom: 10px; font-style: italic; }
        .set-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .set-label { width: 50px; font-weight: bold; }
        input[type="number"] { flex: 1; padding: 10px; background: var(--bg-color); border: 1px solid #333; color: var(--text-main); border-radius: 6px; font-size: 16px; }
        .btn-save { width: 100%; padding: 15px; background-color: var(--success); color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        #history-section { display: none; }
        .chart-container { position: relative; height: 300px; width: 100%; background: var(--card-bg); border-radius: 12px; padding: 10px; box-sizing: border-box; margin-bottom: 20px; }
        .history-list { margin-top: 20px; }
        .history-entry { background: var(--card-bg); padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .history-date { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        #toast { visibility: hidden; min-width: 250px; background-color: var(--success); color: #000; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 100; left: 50%; bottom: 30px; font-weight: bold; transform: translateX(-50%); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <h1>Homegym Tracker</h1>
    
    <div class="nav-buttons">
        <button id="btn-workout" class="btn active" onclick="window.switchTab('workout')">🏋️ Training</button>
        <button id="btn-history" class="btn" onclick="window.switchTab('history')">📊 Fortschritt</button>
    </div>

    <!-- WORKOUT SECTION -->
    <div id="workout-section">
        <select id="workout-selector" onchange="window.renderWorkout()">
            <option value="" disabled selected>Lade Daten aus Cloud...</option>
            <option value="OK1">Oberkörper 1 (Brust & Dichte)</option>
            <option value="UK1">Unterkörper 1 (Quads & Dehnung)</option>
            <option value="OK2">Oberkörper 2 (Breite & Schultern)</option>
            <option value="UK2">Unterkörper 2 (Beinrückseite)</option>
        </select>
        <div id="workout-container"></div>
        <button id="save-btn" class="btn-save" style="display:none;" onclick="window.saveWorkout()">💾 Training Speichern</button>
    </div>

    <!-- HISTORY SECTION -->
    <div id="history-section">
        <select id="history-selector" onchange="window.renderHistory()">
            <option value="" disabled selected>Übung für Analyse wählen...</option>
        </select>
        <div class="chart-container"><canvas id="progressChart"></canvas></div>
        <div id="history-list-container" class="history-list"></div>
    </div>

    <div id="toast">Workout in Cloud gespeichert! 💪</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZaBxiXvtkoeUFjKkwlcIUihhHaIkTYAw",
            authDomain: "homegym-tracker-3fdd4.firebaseapp.com",
            projectId: "homegym-tracker-3fdd4",
            storageBucket: "homegym-tracker-3fdd4.firebasestorage.app",
            messagingSenderId: "866653861174",
            appId: "1:866653861174:web:28685adda348103c15ef97",
            measurementId: "G-4QW6KENRYB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "homegym", "historyData");

        window.historyObj = {};
        let chartInstance = null;

        const plans = {
            "OK1": [{ id: "ok1_1", name: "Bankdrücken", target: "4 Sätze x 8–10 Wdh." }, { id: "ok1_2", name: "Klimmzüge (Zusatzgewicht)", target: "3 Sätze x 8–10 Wdh." }, { id: "ok1_3", name: "Dips (Zusatzgewicht)", target: "3 Sätze x 8–12 Wdh." }, { id: "ok1_4", name: "Vorgebeugtes Rudern", target: "3 Sätze x 8–12 Wdh." }, { id: "ok1_5", name: "Seitheben", target: "4 Sätze x 12–15 Wdh." }],
            "UK1": [{ id: "uk1_1", name: "Tiefe Kniebeugen", target: "4 Sätze x 8–10 Wdh." }, { id: "uk1_2", name: "Rumänisches Kreuzheben", target: "3 Sätze x 8–10 Wdh." }, { id: "uk1_3", name: "Beinstrecker", target: "3 Sätze x 10–12 Wdh." }, { id: "uk1_4", name: "Wadenheben stehend", target: "4 Sätze x 12–15 Wdh." }],
            "OK2": [{ id: "ok2_1", name: "Klimmzüge (Zusatzgewicht)", target: "4 Sätze x 8–10 Wdh." }, { id: "ok2_2", name: "Schulterdrücken", target: "3 Sätze x 8–10 Wdh." }, { id: "ok2_3", name: "Bankdrücken o. Butterfly", target: "3 Sätze x 8–12 Wdh." }, { id: "ok2_4", name: "Dips (Körpergewicht)", target: "3 Sätze x AMRAP" }, { id: "ok2_5", name: "Seitheben", target: "4 Sätze x 12–15 Wdh." }],
            "UK2": [{ id: "uk2_1", name: "Rumänisches Kreuzheben", target: "4 Sätze x 8–10 Wdh." }, { id: "uk2_2", name: "Beinbeuger", target: "3 Sätze x 10–12 Wdh." }, { id: "uk2_3", name: "Ausfallschritte o. Kniebeugen", target: "3 Sätze x 10–12 Wdh." }, { id: "uk2_4", name: "Planks (Zusatzgewicht)", target: "3 Sätze x 45–60 Sek." }]
        };

        async function loadCloudData() {
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    window.historyObj = docSnap.data();
                }
                document.getElementById('workout-selector').options[0].text = "Wähle dein Training...";
            } catch(e) {
                console.error("Fehler beim Laden:", e);
                document.getElementById('workout-selector').options[0].text = "Fehler bei Verbindung!";
            }
        }
        loadCloudData();

        window.switchTab = function(tab) {
            document.getElementById('workout-section').style.display = tab === 'workout' ? 'block' : 'none';
            document.getElementById('history-section').style.display = tab === 'history' ? 'block' : 'none';
            document.getElementById('btn-workout').classList.toggle('active', tab === 'workout');
            document.getElementById('btn-history').classList.toggle('active', tab === 'history');
            if (tab === 'history') window.populateHistorySelector();
        };

        window.renderWorkout = function() {
            const selectedPlan = document.getElementById('workout-selector').value;
            const container = document.getElementById('workout-container');
            container.innerHTML = '';
            if (!selectedPlan) { document.getElementById('save-btn').style.display = 'none'; return; }
            document.getElementById('save-btn').style.display = 'block';

            plans[selectedPlan].forEach(ex => {
                const sets = parseInt(ex.target.charAt(0)); 
                let historyText = "Noch keine Daten in der Cloud.";
                
                if(window.historyObj[ex.id] && window.historyObj[ex.id].length > 0) {
                    const lastSession = window.historyObj[ex.id][window.historyObj[ex.id].length - 1];
                    let bestW = 0; let bestR = 0;
                    lastSession.sets.forEach(s => { if(s.w > bestW || (s.w === bestW && s.r > bestR)) { bestW = s.w; bestR = s.r; }});
                    historyText = `Letztes Mal: ${bestW} kg x ${bestR} Wdh (${lastSession.date})`;
                }

                let cardHTML = `<div class="exercise-card"><div class="exercise-title">${ex.name}</div><div class="exercise-target">Ziel: ${ex.target}</div><div class="last-workout">${historyText}</div>`;
                for(let i=1; i<=sets; i++) {
                    cardHTML += `<div class="set-row"><span class="set-label">Satz ${i}</span><input type="number" step="0.5" id="${ex.id}_w_${i}" placeholder="Kg"><input type="number" id="${ex.id}_r_${i}" placeholder="Wdh"></div>`;
                }
                cardHTML += `</div>`;
                container.innerHTML += cardHTML;
            });
        };

        window.saveWorkout = async function() {
            const selectedPlan = document.getElementById('workout-selector').value;
            const now = new Date();
            const dateString = now.toLocaleDateString('de-CH') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            plans[selectedPlan].forEach(ex => {
                const sets = parseInt(ex.target.charAt(0));
                let sessionSets = [];
                for(let i=1; i<=sets; i++) {
                    const wVal = parseFloat(document.getElementById(`${ex.id}_w_${i}`).value) || 0;
                    const rVal = parseInt(document.getElementById(`${ex.id}_r_${i}`).value) || 0;
                    if(wVal > 0 || rVal > 0) sessionSets.push({ set: i, w: wVal, r: rVal });
                }
                if(sessionSets.length > 0) {
                    if(!window.historyObj[ex.id]) window.historyObj[ex.id] = [];
                    window.historyObj[ex.id].push({ date: dateString, sets: sessionSets });
                }
            });

            await setDoc(docRef, window.historyObj);
            
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            window.renderWorkout();
        };

        window.populateHistorySelector = function() {
            const selector = document.getElementById('history-selector');
            selector.innerHTML = '<option value="" disabled selected>Übung für Analyse wählen...</option>';
            Object.values(plans).forEach(plan => {
                plan.forEach(ex => {
                    if(window.historyObj[ex.id] && window.historyObj[ex.id].length > 0) {
                        selector.innerHTML += `<option value="${ex.id}">${ex.name}</option>`;
                    }
                });
            });
        };

        window.renderHistory = function() {
            const exId = document.getElementById('history-selector').value;
            const data = window.historyObj[exId];
            if(!data) return;

            let exName = "";
            Object.values(plans).forEach(p => p.forEach(e => { if(e.id === exId) exName = e.name; }));

            const labels = data.map(d => d.date.split(' ')[0]);
            const weights = data.map(d => Math.max(...d.sets.map(s => s.w)));

            if(chartInstance) chartInstance.destroy();
            const ctx = document.getElementById('progress
